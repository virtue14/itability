name: Backend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'itability-be/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - board-service
          - member-service
          - report-service
          - gateway-server
          - eureka-server
          - config-server

    name: Build ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x itability-be/${{ matrix.service }}/gradlew

      - name: Build ${{ matrix.service }}
        working-directory: itability-be/${{ matrix.service }}
        run: ./gradlew build -x test
